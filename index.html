<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modulabschlussprüfung</title><style>html,body{margin:0;height:100%;background:#171a1f}iframe{border:0;width:100%;height:100%;display:block}.reset{position:fixed;right:16px;bottom:16px;z-index:9999;border:1px solid #59616d;background:#343b45;color:#f7f8fa;border-radius:10px;padding:10px 14px;font:700 14px system-ui,Segoe UI,Arial;cursor:pointer;box-shadow:0 3px 14px #0008}</style></head><body><iframe id="trainer" src="trainer.html?v=7" title="Modulabschlussprüfung"></iframe><button class="reset" onclick="resetProgress()">Fortschritt zurücksetzen</button><script>function resetProgress(){if(!confirm('Nur den gespeicherten Fortschritt wirklich zurücksetzen?'))return;const k='modulabschluss_v7';try{const old=JSON.parse(localStorage.getItem(k)||'{}');localStorage.setItem(k,JSON.stringify({mastered:[],wrong:[],flagged:Array.isArray(old.flagged)?old.flagged:[]}));document.getElementById('trainer').contentWindow.location.reload()}catch(e){localStorage.removeItem(k);document.getElementById('trainer').contentWindow.location.reload()}}</script></body></html>
